<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Village Admin Login</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="form-container">

<h1>🏛️ Village Admin Login</h1>

<form id="sarpanchLoginForm">

<input
type="text"
id="username"
placeholder="Username"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>

<p id="msg"></p>

</form>

</div>

<script>

const form=document.getElementById("sarpanchLoginForm");

form.addEventListener("submit",async function(e){

e.preventDefault();

const response=await fetch("/api/admin/login",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

username:document.getElementById("username").value,

password:document.getElementById("password").value

})

});

const data=await response.json();

const msg=document.getElementById("msg");

if(data.success){

msg.style.color="green";

msg.innerHTML="Login Successful";

localStorage.setItem("adminToken",data.token);

localStorage.setItem("sarpanch",JSON.stringify(data.sarpanch));

setTimeout(()=>{

window.location.href="sarpanch-dashboard.html";

},500);

}

else{

msg.style.color="red";

msg.innerHTML=data.message;

}

});

</script>

</body>
</html>
